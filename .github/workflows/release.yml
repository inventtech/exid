name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # required for npm provenance attestation

jobs:
  release:
    name: semantic-release → npm
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Gate the release on the same checks CI runs — a green PR can still go red on main.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:universal
      - run: bun run check:pack
      - run: bun run test:pack

      # Until npm auth is configured the publish would fail with EINVALIDNPMTOKEN and leave the
      # repo permanently red, so skip it with a visible notice instead. Set the NPM_TOKEN secret,
      # or the NPM_TRUSTED_PUBLISHING=true repo variable once npm Trusted Publishing (OIDC) is on.
      - name: Check npm auth
        id: npm_auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ] || [ "${{ vars.NPM_TRUSTED_PUBLISHING }}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::npm auth is not configured. Add the NPM_TOKEN secret, or set the NPM_TRUSTED_PUBLISHING=true repo variable after enabling npm Trusted Publishing."
          fi

      - name: semantic-release
        if: steps.npm_auth.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed when the package uses npm Trusted Publishing (OIDC); kept as the fallback.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: >
          npx --yes
          --package semantic-release@25
          --package @semantic-release/changelog@6
          --package @semantic-release/git@10
          --package @semantic-release/npm@13
          --package @semantic-release/github@12
          semantic-release
